name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-server:
    name: Validate Python server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Flask server import
        run: python -B -c "import simulation_server; print('simulation_server import OK')"

  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    needs: validate-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger deploy hook
        if: env.DEPLOY_HOOK_URL != ''
        run: |
          if [[ "$DEPLOY_HOOK_URL" == http://* || "$DEPLOY_HOOK_URL" == https://* ]]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          else
            echo "DEPLOY_HOOK_URL is set but is not a valid http(s) URL. Skipping generic deploy hook."
          fi

      - name: Skip deploy hook
        if: env.DEPLOY_HOOK_URL == ''
        run: echo "No DEPLOY_HOOK_URL secret configured. Image was built and pushed only."

  deploy-huggingface:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ secrets.HF_SPACE }}

    steps:
      - name: Checkout repository
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push source to Hugging Face Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add huggingface "https://HF:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push --force huggingface HEAD:main

      - name: Skip Hugging Face deploy
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "HF_TOKEN and HF_SPACE secrets are not configured. Hugging Face deploy skipped."
